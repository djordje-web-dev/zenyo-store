# Lokalno okruzenje za ZENYO prodavnicu.
#   Podizanje:  docker compose up -d
#   Gasenje:    docker compose down          (podaci ostaju)
#   Brisanje:   docker compose down -v       (brise i bazu - sve ispocetka)
#   WP-CLI:     docker compose run --rm cli <komanda>   npr. cli plugin list

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
    volumes: &wp_volumes
      - wp_data:/var/www/html
      # Nasa tema: fajlovi su na disku, u Git-u, i odmah se vide na sajtu.
      - ./theme/zenyo:/var/www/html/wp-content/themes/zenyo
      # Samo za lokalni rad (npr. hvatanje mejlova). Ne ide na pravi sajt.
      - ./local/mu-plugins:/var/www/html/wp-content/mu-plugins

  # Mailpit hvata sve mejlove koje sajt posalje i prikazuje ih na http://localhost:8091
  # Nista ne odlazi pravim kupcima.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8091}:8025"

  # WP-CLI: alat za upravljanje WordPress-om iz komandne linije.
  # Ne radi stalno; pokrece se po potrebi (profil "tools").
  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment: *wp_env
    volumes:
      - wp_data:/var/www/html
      - ./theme/zenyo:/var/www/html/wp-content/themes/zenyo
      - ./local/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts:ro
      - ./seed:/seed:ro

volumes:
  db_data:
  wp_data:
